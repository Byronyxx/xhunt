version: '3.9'

services:
  auth:
    build: ./backend
    ports:
      - '8000:8000'
    env_file: ./backend/.env
    environment:
      - APP_ENV=production
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped
    volumes:
      - redis_data:/data

  worker:
    build: ./backend
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=4
    env_file: ./backend/.env
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
